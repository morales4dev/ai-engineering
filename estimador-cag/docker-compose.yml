# Docker Compose configuration for local development.
# For production, remove the bind mount and the --reload flag.

services:
  estimator:
    build: .
    container_name: estimator
    ports:
      - "8000:8000"

    # Load environment variables (API keys, config) from the local .env file.
    env_file:
      - .env

    # Override REDIS_URL for the in-network Redis service. The .env value
    # (redis://localhost:6379) is meant for running uvicorn outside Docker.
    environment:
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/estimator
      CATALOG_PATH: /app/data/catalog/catalog.yaml
      INGESTION_DATA_ROOT: /app/data/seed

    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

    # Bind-mount src/ so code changes are reflected immediately inside the
    # container without rebuilding the image. The image venv lives at
    # /opt/venv, so this mount cannot hide installed packages.
    # ./src:/app hides image files under /app, so alembic/data mount on top.
    volumes:
      - ./src:/app
      - ./alembic:/app/alembic
      - ./alembic.ini:/app/alembic.ini
      - ./data:/app/data
      - ./scripts:/app/scripts

    # Apply pending migrations on startup, then run uvicorn with auto-reload.
    # Remove --reload for production deployments.
    command: >
      sh -c "alembic upgrade head &&
             uvicorn main:app --host 0.0.0.0 --port 8000 --reload"

    restart: unless-stopped

    # Health check using Python's stdlib (curl is not available in slim images).
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

  redis:
    # Redis Stack ships RediSearch (semantic cache). redis:7-alpine does not.
    image: redis/redis-stack:7.4.0-v0
    container_name: estimator-redis
    ports:
      - "6379:6379"
      - "8001:8001"  # RedisInsight
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg16
    container_name: estimator-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: estimator
    # Session 8 live: tuning for HNSW index builds. Parallel builds use shared
    # memory, hence shm_size. The -c values are conservative so they work on
    # any reasonable dev machine; in real production they scale with the RAM
    # of the host (rule of thumb: shared_buffers ~25% of RAM,
    # effective_cache_size ~75%, maintenance_work_mem as much as one index
    # build needs without starving the rest).
    shm_size: 1gb
    command: >
      postgres
      -c shared_buffers=512MB
      -c effective_cache_size=1536MB
      -c work_mem=64MB
      -c maintenance_work_mem=512MB
      -c max_parallel_maintenance_workers=2
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d estimator"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  redis_data:
  postgres_data:
